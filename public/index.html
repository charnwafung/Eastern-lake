<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eastern Lake · Restaurante Chino</title>
  <meta name="description" content="Eastern Lake Restaurante Chino en Villa Andalucía, San Juan. Ordena en línea para recoger o mira el menú.">
  <meta name="theme-color" content="#0e3b33">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <section class="hero">
    <button class="lang" id="langBtn" type="button" aria-label="Change language">EN</button>
    <img class="logo" src="/assets/logo-icon.png" alt="Eastern Lake">
    <h1>Eastern Lake</h1>
    <div class="sub">Restaurante Chino</div>
    <a class="addr" id="addr" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Centro Comercial Villa Andalucía, San Juan</span>
    </a>
    <span class="pill" id="statusPill" hidden></span>
    <div class="ctas">
      <a class="btn primary" href="/ordenar">
        <span class="t"><span id="orderLbl">Ordenar ahora</span><small id="orderSub">Para recoger</small></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="btn secondary" href="/menu">
        <span class="t"><span id="menuLbl">Ver menú</span><small id="menuSub">Platos y precios</small></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      </a>
    </div>
    <p class="note" id="note">Servicarro y órdenes por teléfono disponibles</p>
  </section>

  <section class="info">
    <div class="card">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <div style="flex:1"><h3 id="hoursT">Horario</h3><div id="hours"></div></div>
    </div>
    <div class="card">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>
      <div><h3 id="callT">Llámanos</h3><div id="phones"></div></div>
    </div>
  </section>
  <footer class="home"><img src="/assets/logo-icon.png" alt="">Eastern Lake · Restaurante Chino</footer>

  <script src="/common.js"></script>
  <script>
  (() => {
    const { t, time, sameDay, esc } = EL;
    const $ = (s) => document.querySelector(s);
    let data = null;
    const DAYS = { es: ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };
    const hm = (s) => { const [h, m] = s.split(':').map(Number); const d = new Date(Date.UTC(2020, 0, 1, h + 4, m)); return time(d.toISOString()); };

    function render() {
      $('#langBtn').textContent = EL.lang === 'es' ? 'EN' : 'ES';
      $('#orderLbl').textContent = t('orderNow');
      $('#menuLbl').textContent = t('viewMenu'); $('#menuSub').textContent = t('viewMenuSub');
      $('#note').textContent = t('servicarro'); $('#hoursT').textContent = t('hoursT'); $('#callT').textContent = t('callUs');
      if (!data) return;
      const R = data.restaurant; const s = data.status;
      $('#addr').href = R.mapsUrl;
      $('#phones').innerHTML = R.phones.map((p) => `<p class="mono">${esc(p)}</p>`).join('')
        + `<div class="act"><a class="chip-link" href="tel:+1${R.phones[0].replace(/\D/g, '')}">${esc(t('call'))}</a></div>`;
      // Status pill (same rules as the ordering page)
      const pill = $('#statusPill'); pill.hidden = false; pill.className = 'pill';
      const now = new Date(s.now);
      const opens = (iso) => (sameDay(new Date(iso), now) ? t('opensAt', { t: time(iso) }) : t('opensTomorrow', { t: time(iso) }));
      if (s.paused) { pill.classList.add('closed'); pill.textContent = t('paused'); }
      else if (s.asap) pill.textContent = `${t('open')} · ${t('closesAt', { t: time(s.closeAt) })}`;
      else if (s.canOrder) { pill.classList.add('later'); pill.textContent = `${t('closed')} · ${opens(s.openAt)}`; }
      else { pill.classList.add('closed'); pill.textContent = s.nextOpen ? `${t('closed')} · ${opens(s.nextOpen)}` : t('closed'); }
      $('#orderSub').textContent = s.asap ? t('orderNowSub', { m: s.prepMinutes }) : t('orderLaterSub');
      // Hours: one line when every day is the same, otherwise the week with today highlighted
      const H = data.hours; const keys = ['0', '1', '2', '3', '4', '5', '6'];
      const same = keys.every((k) => JSON.stringify(H[k]) === JSON.stringify(H['0'])) && H['0'];
      const range = (h) => (h ? `${hm(h[0])} – ${hm(h[1])}` : t('closedToday'));
      if (same) $('#hours').innerHTML = `<p><b>${esc(range(H['0']))}</b></p><p class="muted">${esc(t('everyDay'))}</p>`;
      else {
        const today = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Puerto_Rico', weekday: 'short' }).format(now);
        const ti = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(today);
        $('#hours').innerHTML = `<div class="hours-list">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<div class="${d === ti ? 'today' : ''}"><span>${DAYS[EL.lang][d]}</span><span>${esc(range(H[String(d)]))}</span></div>`).join('')}</div>`;
      }
    }
    async function load() {
      try { data = await (await fetch('/api/menu')).json(); } catch {}
      render();
    }
    $('#langBtn').onclick = () => { EL.setLang(EL.lang === 'es' ? 'en' : 'es'); render(); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    render(); load();
  })();
  </script>
</body>
</html>
