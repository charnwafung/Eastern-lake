<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eastern Lake · Ordena para recoger</title>
  <meta name="description" content="Eastern Lake Restaurante Chino — ordena en línea y recoge en Villa Andalucía, San Juan.">
  <meta name="theme-color" content="#0e3b33">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <a class="brand" href="/">
        <img src="/assets/logo-icon.png" alt="">
        <div>
          <div class="brand-name">Eastern Lake</div>
          <div class="brand-sub">Restaurante Chino</div>
        </div>
      </a>
      <button class="lang" id="langBtn" type="button" aria-label="Change language">EN</button>
    </div>
    <div class="hero-info">
      <span class="pill" id="statusPill">…</span>
      <span id="pickupOnly"></span>
      <a id="phoneLink" href="tel:+17872920920">787-292-0920</a>
    </div>
  </header>
  <div id="notice"></div>

  <nav class="catnav" aria-label="Categorías">
    <div class="catnav-inner" id="chips">
      <button class="search-btn" id="searchToggle" type="button" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="searchbar" id="searchbar"><input id="search" type="search" autocomplete="off" enterkeyhint="search"></div>
  </nav>

  <main id="menu" aria-live="polite"></main>
  <footer class="site" id="footer"></footer>

  <div class="cartbar" id="cartbar">
    <button type="button" id="openCart"><span class="count" id="cartCount">0</span><span id="viewOrderLbl"></span><span class="total" id="cartTotal">$0.00</span></button>
  </div>

  <!-- Item sheet -->
  <dialog class="sheet" id="itemSheet" aria-labelledby="itemTitle">
    <form method="dialog" id="itemForm" style="display:contents">
      <div class="sheet-head">
        <div><h3 id="itemTitle"></h3><div class="sub" id="itemSub"></div></div>
        <button class="close" type="button" data-close aria-label="Cerrar" autofocus><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sheet-body" id="itemBody"></div>
      <div class="sheet-foot foot-row" id="itemFoot">
        <div class="extras-line" id="itemExtras" hidden></div>
        <div class="stepper" id="itemQty">
          <button type="button" data-d="-1" aria-label="Menos">−</button><output>1</output><button type="button" data-d="1" aria-label="Más">+</button>
        </div>
        <button class="btn" type="submit" id="itemSubmit"></button>
      </div>
    </form>
  </dialog>

  <!-- Cart / checkout sheet -->
  <dialog class="sheet" id="cartSheet" aria-labelledby="cartTitle">
    <div class="sheet-head">
      <div><h3 id="cartTitle"></h3><div class="sub" id="cartSub"></div></div>
      <button class="close" type="button" data-close aria-label="Cerrar" autofocus><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="cartBody"></div>
    <div class="sheet-foot" id="cartFoot">
      <div class="formerr" id="payErr" role="alert"></div>
      <button class="btn brass" type="button" id="payBtn"></button>
      <div class="secure"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3H9Z"/></svg><span id="secureLbl"></span></div>
    </div>
  </dialog>

  <script src="/common.js"></script>
  <script src="/options.js"></script>
  <script src="/app.js"></script>
</body>
</html>
